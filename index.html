<!doctype html>
<html lang="en" data-theme="venus">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#100805" />
    <!-- Hard dark first paint — never cream before theme packs land. -->
    <style id="ha-boot-paint">
      html {
        color-scheme: dark;
        background: #100805 !important;
        color: #fff8f0;
      }
      html,
      body,
      #root {
        background: #100805 !important;
        color: #fff8f0;
      }
      .boot-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        background: #100805 !important;
        color: #d0ad8c !important;
        font: 0.95rem/1.4 system-ui, sans-serif;
      }
    </style>
    <script>
      (function () {
        try {
          var id =
            localStorage.getItem("hearts-archive-theme-v5") ||
            localStorage.getItem("hearts-archive-theme-v4") ||
            "venus";
          document.documentElement.setAttribute("data-theme", id);
        } catch (e) {}
        document.documentElement.style.colorScheme = "dark";
        document.documentElement.style.backgroundColor = "#100805";
        if (document.body) document.body.style.backgroundColor = "#100805";
      })();
    </script>
    <meta
      name="description"
      content="Heart’s Archive — on-chain newspaper for PulseChain. Local Press for wallets; text stories and PLS A1 bids at 0x…feed."
    />
    <meta
      name="keywords"
      content="PulseChain, on-chain newspaper, Heart’s Archive, PLS, A1, tip QR, web3 publishing"
    />
    <link
      rel="canonical"
      href="https://ihelpmaybe.github.io/hearts-archive/"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Heart’s Archive" />
    <meta property="og:title" content="Heart’s Archive" />
    <meta
      property="og:description"
      content="Heart’s Archive — on-chain newspaper for PulseChain. Local Press for wallets; text stories and PLS A1 bids at 0x…feed."
    />
    <meta property="og:url" content="https://ihelpmaybe.github.io/hearts-archive/" />
    <meta
      property="og:image"
      content="https://ihelpmaybe.github.io/hearts-archive/og-banner.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@HeartsArc" />
    <meta name="twitter:creator" content="@HeartsArc" />
    <meta name="twitter:title" content="Heart’s Archive" />
    <meta
      name="twitter:description"
      content="Heart’s Archive — on-chain newspaper for PulseChain. Local Press for wallets; text stories and PLS A1 bids at 0x…feed."
    />
    <meta
      name="twitter:image"
      content="https://ihelpmaybe.github.io/hearts-archive/og-banner.png"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Heart’s Archive" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="./icons/icon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Heart’s Archive</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Heart’s Archive",
        "url": "https://ihelpmaybe.github.io/hearts-archive/",
        "description": "On-chain newspaper for PulseChain — text stories, likes, and PLS A1 bids at 0x…feed.",
        "publisher": {
          "@type": "Organization",
          "name": "Heart’s Archive",
          "url": "https://github.com/ihelpmaybe/hearts-archive"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>
      Heart’s Archive needs JavaScript. Download the Press ZIP from
      <a href="https://github.com/ihelpmaybe/hearts-archive/releases/latest"
        >GitHub Releases</a
      >, then run START.cmd / START.sh.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
