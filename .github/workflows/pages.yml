name: GitHub Pages (Press)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: typecheck · lint · unit
        run: |
          npm run typecheck
          npm run lint
          npm run test
      - name: Build Press face for Pages
        env:
          VITE_BASE: /hearts-archive/
          VITE_ARCHIVE_FACE: press
        run: npm run build
      - name: Pages dist smoke
        run: npm run smoke:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
