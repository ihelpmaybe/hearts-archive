name: Release Press + Studio ZIPs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pack Press ZIP
        run: npm run pack:press
      - name: Pack Studio ZIP
        run: npm run pack:studio
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hearts-archive-zips
          path: |
            out/hearts-archive-press.zip
            out/hearts-archive-studio.zip
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/hearts-archive-press.zip
            out/hearts-archive-studio.zip
          generate_release_notes: true
          body: |
            ## Heart’s Archive

            ### Press (everyday — injected wallet)
            1. Download **hearts-archive-press.zip**
            2. Unzip → **START.cmd** / **./START.sh**
            3. Connect Pulse wallet → Write → Publish → Buy A1

            ### Studio (desktop — Trezor Connect + Bridge)
            1. Download **hearts-archive-studio.zip**
            2. Unzip → **START.cmd** / **./START.sh** on a PC with Suite/Bridge
            3. **Connect Trezor** → publish / like / tip / A1

            ### Gallery (read-only)
            GitHub Pages peek + tip QR / PWA. Capacitor `android/` + `ios/` in repo (signed iOS needs Mac + Xcode).

            Frozen ZIPs — only change when **you** download a newer release.
            Money paths: `SECURITY.md` inside each ZIP · Peek: https://ihelpmaybe.github.io/hearts-archive/
